<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  let _recarregado = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (_recarregado) return;
    _recarregado = true;
    location.reload();
  });
}
</script>
